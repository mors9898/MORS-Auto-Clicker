name: Windows Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build portable EXE
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "MORS Auto Clicker" mors_app.py
      - name: Verify build output
        run: |
          if (-not (Test-Path "dist/MORS Auto Clicker.exe")) { throw "Windows EXE not found" }
          Get-FileHash "dist/MORS Auto Clicker.exe" -Algorithm SHA256
        shell: pwsh
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MORS-Auto-Clicker-Windows
          path: dist/MORS Auto Clicker.exe
          if-no-files-found: error
